<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Khả năng đọc màu khi cửa sổ bị che khuất so với khi bị thu nhỏ xuống thanh tác vụ</title>
  <rect width="760" height="330" fill="#ffffff" rx="8"/>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Phân tích hình ảnh ở chế độ khóa cửa sổ: Bị che khuất và Thu nhỏ</text>

  <!-- Left: Overlapped -->
  <rect x="25" y="55" width="340" height="250" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="195" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Cửa sổ bị cửa sổ khác đè lên</text>

  <rect x="45" y="100" width="210" height="105" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="150" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Phần tử đang khóa</text>

  <rect x="145" y="148" width="195" height="82" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="242" y="184" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Cửa sổ Word / Phim</text>
  <text x="242" y="207" text-anchor="middle" font-size="14" fill="#334155">(che phía trên)</text>

  <text x="195" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">CÓ THỂ ĐỌC ĐƯỢC MÀU (TÙY ỨNG DỤNG)</text>
  <text x="195" y="286" text-anchor="middle" font-size="14" fill="#166534">Hãy kiểm tra thực tế bằng kính lúp</text>

  <!-- Right: Minimized -->
  <rect x="395" y="55" width="340" height="250" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="565" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Cửa sổ bị thu nhỏ (Minimize)</text>

  <rect x="440" y="108" width="250" height="75" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="565" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#f8fafc">Kính lúp chỉ thấy màu đen</text>

  <rect x="440" y="198" width="250" height="32" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="565" y="219" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Đang thu nhỏ dưới thanh tác vụ</text>

  <text x="565" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">KHÔNG ĐỌC ĐƯỢC MÀU</text>
  <text x="565" y="286" text-anchor="middle" font-size="14" fill="#7f1d1d">Windows ngừng vẽ để tiết kiệm tài nguyên</text>
</svg>
