<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Cấu trúc mảng kết quả của SCANPXL và SCANPICTURE và thứ tự lấy ra bằng ARRPOP</title>
  <rect width="760" height="310" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="ar-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Cấu trúc cặp tọa độ trong mảng $var và thứ tự lấy ra bằng ARRPOP</text>

  <!-- Array cells -->
  <text x="45" y="75" font-size="15" font-weight="700" fill="#1e3a8a">1. Khi SCANPXL / SCANPICTURE ghi vào mảng $var (theo cặp X trước, Y sau):</text>

  <rect x="45" y="92" width="150" height="65" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="120" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">$var[0] = X₁</text>
  <text x="120" y="142" text-anchor="middle" font-size="14" fill="#334155">Điểm 1 (X)</text>

  <rect x="205" y="92" width="150" height="65" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="280" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">$var[1] = Y₁</text>
  <text x="280" y="142" text-anchor="middle" font-size="14" fill="#334155">Điểm 1 (Y)</text>

  <rect x="375" y="92" width="150" height="65" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="450" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">$var[2] = X₂</text>
  <text x="450" y="142" text-anchor="middle" font-size="14" fill="#92400e">Điểm 2 (X)</text>

  <rect x="535" y="92" width="150" height="65" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="610" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">$var[3] = Y₂</text>
  <text x="610" y="142" text-anchor="middle" font-size="14" fill="#92400e">Điểm 2 (Y) — Cuối</text>

  <!-- ARRPOP explanation -->
  <text x="45" y="202" font-size="15" font-weight="700" fill="#991b1b">2. Khi dùng ARRPOP($var) rút từ cuối mảng ra (phải lấy Y trước, X sau):</text>

  <rect x="45" y="220" width="310" height="64" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="200" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Bước 1: $y = ARRPOP($var)</text>
  <text x="200" y="268" text-anchor="middle" font-size="14" fill="#7f1d1d">Lấy phần tử cuối cùng (Y₂) ra trước</text>

  <line x1="355" y1="252" x2="395" y2="252" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar-p)"/>

  <rect x="400" y="220" width="310" height="64" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="555" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Bước 2: $x = ARRPOP($var)</text>
  <text x="555" y="268" text-anchor="middle" font-size="14" fill="#166534">Lấy phần tử kế cuối (X₂) ra tiếp theo</text>
</svg>
