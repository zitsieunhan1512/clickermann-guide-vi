<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Vòng lặp thực thi tự động của script trong Clickermann và lệnh HALT</title>
  <rect width="720" height="340" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Thứ tự chạy tự động từ trên xuống dưới của script</text>

  <!-- Step 1 -->
  <rect x="210" y="60" width="260" height="50" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="340" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Dòng 1: LCLICK(100, 200)</text>

  <line x1="340" y1="110" x2="340" y2="142" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Step 2 -->
  <rect x="210" y="145" width="260" height="50" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="340" y="175" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Dòng 2: WAIT(1)</text>

  <line x1="340" y1="195" x2="340" y2="227" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Step 3 -->
  <rect x="210" y="230" width="260" height="54" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="340" y="262" text-anchor="middle" font-size="15" font-weight="600" fill="#78350f">Dòng cuối của script</text>

  <!-- Loop back path -->
  <path d="M 210 257 L 70 257 L 70 85 L 206 85" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
  <text x="84" y="165" font-size="14" font-weight="600" fill="#1d4ed8">Không có HALT:</text>
  <text x="84" y="185" font-size="14" fill="#1e3a8a">Tự quay lại dòng 1</text>

  <!-- HALT exit path -->
  <line x1="470" y1="257" x2="555" y2="257" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="560" y="230" width="130" height="54" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="625" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Gặp HALT</text>
  <text x="625" y="273" text-anchor="middle" font-size="14" fill="#7f1d1d">Dừng hẳn</text>
</svg>
