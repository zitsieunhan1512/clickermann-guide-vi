<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>So sánh chế độ thường và chế độ khóa cửa sổ trong Clickermann</title>
  <rect width="760" height="320" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="ar-1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="ar-2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
  </defs>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Chế độ thường so với Chế độ khóa cửa sổ (Alt + W)</text>

  <!-- Left panel: Normal mode -->
  <rect x="25" y="55" width="340" height="240" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="195" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">Chế độ thường</text>

  <rect x="45" y="110" width="300" height="48" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="195" y="139" text-anchor="middle" font-size="13.5" font-weight="600" fill="#78350f">Điều khiển trực tiếp chuột &amp; bàn phím thật</text>

  <line x1="195" y1="158" x2="195" y2="188" stroke="#b45309" stroke-width="2.5" marker-end="url(#ar-1)"/>

  <rect x="45" y="193" width="300" height="48" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="195" y="222" text-anchor="middle" font-size="13.5" font-weight="600" fill="#78350f">Chiếm thiết bị đầu vào trong lúc chạy</text>

  <text x="195" y="268" text-anchor="middle" font-size="13.5" fill="#9a3412">Suy luận: không thể làm việc khác cùng lúc</text>

  <!-- Right panel: Window mode -->
  <rect x="395" y="55" width="340" height="240" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="565" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Chế độ khóa cửa sổ</text>

  <rect x="415" y="105" width="300" height="44" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="565" y="132" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532d">Clickermann gửi thẳng thông điệp</text>

  <line x1="565" y1="149" x2="565" y2="180" stroke="#15803d" stroke-width="2.5" marker-end="url(#ar-2)"/>

  <rect x="415" y="185" width="300" height="44" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="565" y="212" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532d">Chỉ phần tử đang khóa (HWND) nhận</text>

  <text x="565" y="262" text-anchor="middle" font-size="13.5" font-weight="600" fill="#15803d">Chuột &amp; phím thật rảnh để làm việc khác</text>
</svg>
