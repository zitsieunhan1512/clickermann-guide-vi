<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Quy trình vẽ một nét liền trong Paint bằng LDOWN, các lệnh MOVE và LUP</title>
  <rect width="780" height="280" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="ar-draw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <text x="390" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Thứ tự lệnh trên một nét vẽ liền: LDOWN → MOVE → LUP</text>

  <!-- Line segments -->
  <line x1="100" y1="145" x2="270" y2="145" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#ar-draw)"/>
  <line x1="290" y1="145" x2="460" y2="145" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#ar-draw)"/>
  <line x1="480" y1="145" x2="660" y2="145" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#ar-draw)"/>

  <!-- Point 1: LDOWN -->
  <circle cx="90" cy="145" r="10" fill="#15803d"/>
  <text x="90" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">1. LDOWN(x1, y1)</text>
  <text x="90" y="190" text-anchor="middle" font-size="14" fill="#166534">Nhấn giữ cọ vẽ</text>

  <!-- Point 2: MOVE -->
  <circle cx="280" cy="145" r="9" fill="#1d4ed8"/>
  <text x="280" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">2. MOVE(x2, y2)</text>
  <text x="280" y="190" text-anchor="middle" font-size="14" fill="#1e3a8a">Kéo cọ sang điểm 2</text>

  <!-- Point 3: MOVE -->
  <circle cx="470" cy="145" r="9" fill="#1d4ed8"/>
  <text x="470" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">3. MOVE(x3, y3)</text>
  <text x="470" y="190" text-anchor="middle" font-size="14" fill="#1e3a8a">Kéo tiếp sang điểm 3</text>

  <!-- Point 4: LUP -->
  <circle cx="670" cy="145" r="10" fill="#b91c1c"/>
  <text x="670" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">4. LUP(x4, y4)</text>
  <text x="670" y="190" text-anchor="middle" font-size="14" fill="#991b1b">Nhả chuột kết thúc nét</text>

  <text x="390" y="246" text-anchor="middle" font-size="13.5" fill="#334155">Suy luận: dùng MOVE kèm WAITMS để Paint vẽ nối liền giữa các điểm (chưa chạy thử).</text>
</svg>
