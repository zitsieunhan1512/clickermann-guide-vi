<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>So sánh hệ tọa độ màn hình và hệ tọa độ tương đối của phần tử đang khóa</title>
  <rect width="760" height="400" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="ax-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ax-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c2410c"/>
    </marker>
  </defs>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Hệ tọa độ màn hình và hệ tọa độ phần tử đang khóa</text>

  <!-- Desktop box -->
  <rect x="60" y="75" width="640" height="295" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="675" y="104" text-anchor="end" font-size="15" font-weight="700" fill="#1e3a8a">Màn hình (Desktop 800×600)</text>

  <!-- Desktop origin and axes -->
  <circle cx="60" cy="75" r="5" fill="#1d4ed8"/>
  <text x="80" y="104" font-size="14" font-weight="700" fill="#1d4ed8">Gốc màn hình (0, 0)</text>
  <line x1="60" y1="75" x2="260" y2="75" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ax-b)"/>
  <text x="160" y="61" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Trục X (sang phải)</text>
  <line x1="60" y1="75" x2="60" y2="245" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ax-b)"/>
  <text x="80" y="240" font-size="14" font-weight="700" fill="#1d4ed8">Trục Y (xuống dưới)</text>

  <circle cx="700" cy="370" r="5" fill="#1d4ed8"/>
  <text x="675" y="352" text-anchor="end" font-size="14" font-weight="600" fill="#1e3a8a">Góc phải dưới (799, 599)</text>

  <!-- Locked child element -->
  <rect x="235" y="145" width="350" height="170" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
  <text x="410" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Phần tử đang khóa (Chế độ khóa cửa sổ)</text>

  <circle cx="235" cy="145" r="5" fill="#c2410c"/>
  <text x="255" y="204" font-size="14" font-weight="700" fill="#c2410c">Gốc riêng (0, 0) của phần tử</text>
  <line x1="235" y1="145" x2="385" y2="145" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ax-o)"/>
  <line x1="235" y1="145" x2="235" y2="265" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ax-o)"/>

  <text x="255" y="244" font-size="14" fill="#7c2d12">• Tọa độ tính từ góc trái trên của phần tử.</text>
  <text x="255" y="272" font-size="14" fill="#7c2d12">• Di chuyển cửa sổ không làm đổi tọa độ nội bộ.</text>
</svg>
